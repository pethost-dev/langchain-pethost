[project]
name = "langchain-pethost"
version = "0.1.0"
description = "LangChain tools for Pethost: an agent deploys Docker Compose projects, reads their logs and requests, runs commands and makes databases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pethost", email = "support@pethost.dev" }]
keywords = ["langchain", "langgraph", "mcp", "pethost", "deploy", "docker-compose", "hosting", "agents", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "langchain-core>=1.3.3,<2",
    # load_mcp_server_info, which reads the server's instructions, came in 0.3.1; this package
    # was tested with 0.3.2.
    "langchain-mcp-adapters>=0.3.2,<0.4",
]

[project.urls]
Homepage = "https://pethost.dev"
Documentation = "https://github.com/pethost-dev/langchain-pethost#readme"
Repository = "https://github.com/pethost-dev/langchain-pethost"
Issues = "https://github.com/pethost-dev/langchain-pethost/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["langchain_pethost", "tests", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "mcp>=1.24,<2",
    "pytest>=8",
    "ruff>=0.14",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
